<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Rotina</title>
<style>
  :root {
    --bg: #0e0e10;
    --surface: #18181b;
    --surface2: #222226;
    --border: #2e2e33;
    --accent: #7c6af7;
    --accent2: #a89cf7;
    --now: #22c55e;
    --next: #f59e0b;
    --text: #f4f4f5;
    --muted: #71717a;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    padding: 16px 16px 0;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .header-top h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .clock { font-size: 22px; font-weight: 700; color: var(--accent2); font-variant-numeric: tabular-nums; }

  /* BANNER ATUAL/PRÓXIMA */
  .banner {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .banner-card {
    flex: 1;
    background: var(--surface);
    border-radius: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
  }
  .banner-card.now { border-color: var(--now); background: #052e16; }
  .banner-card.next { border-color: var(--next); background: #1c1400; }
  .banner-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .banner-card.now .banner-label { color: var(--now); }
  .banner-card.next .banner-label { color: var(--next); }
  .banner-time { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .banner-task { font-size: 13px; font-weight: 600; line-height: 1.3; }

  /* TABS DIAS */
  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 10px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
  .tab.today { border-color: var(--accent2); color: var(--accent2); }
  .tab.active.today { background: var(--accent); color: white; }

  /* LISTA */
  .list { padding: 0 16px 80px; }
  .block {
    border-radius: 10px;
    margin-bottom: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
    transition: border-color 0.2s;
  }
  .block.now { border-color: var(--now); background: #052e16; }
  .block.next-block { border-color: var(--next); }
  .block-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .block-time {
    font-size: 11px;
    color: var(--muted);
    min-width: 90px;
    font-variant-numeric: tabular-nums;
  }
  .block.now .block-time { color: var(--now); font-weight: 600; }
  .block.next-block .block-time { color: var(--next); font-weight: 600; }
  .block-title {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }
  .block-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }
  .block.now .block-dot { background: var(--now); }
  .block.next-block .block-dot { background: var(--next); }

  /* SUB-ITENS */
  .sub-items {
    display: none;
    padding: 0 12px 10px 22px;
    border-top: 1px solid var(--border);
  }
  .block.open .sub-items { display: block; }
  .sub-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    line-height: 1.4;
  }
  .sub-item:last-child { border-bottom: none; }
  .sub-icon { font-size: 13px; flex-shrink: 0; margin-top: 1px; }
  .sub-text { color: #d4d4d8; }
  .sub-text strong { color: var(--text); font-weight: 600; }

  /* EDITOR */
  .edit-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    font-size: 11px;
    color: var(--accent2);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  /* MODAL EDITOR */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface2);
    border-radius: 16px 16px 0 0;
    padding: 20px 16px 40px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h3 { font-size: 15px; margin-bottom: 4px; }
  .modal p { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .modal textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    padding: 10px;
    min-height: 120px;
    resize: vertical;
    font-family: inherit;
    line-height: 1.5;
  }
  .modal-btns { display: flex; gap: 8px; margin-top: 10px; }
  .btn-save {
    flex: 1;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-cancel {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 16px;
    font-size: 13px;
    cursor: pointer;
  }

  /* NOW indicator pulse */
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .pulse { animation: pulse 2s infinite; }
</style>
</head>

<header>
  <div class="header-top">
    <h1>Minha Rotina</h1>
    <div class="clock" id="clock">--:--</div>
  </div>
  <div class="banner">
    <div class="banner-card now" id="banner-now">
      <div class="banner-label">▶ Agora</div>
      <div class="banner-time" id="bn-time">--:-- – --:--</div>
      <div class="banner-task" id="bn-task">—</div>
    </div>
    <div class="banner-card next" id="banner-next">
      <div class="banner-label">⏭ Próxima</div>
      <div class="banner-time" id="bx-time">--:--</div>
      <div class="banner-task" id="bx-task">—</div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="list" id="list"></div>

<!-- Modal editor -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Editar detalhes</h3>
    <p id="modal-title-label">—</p>

    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveModal()">Salvar</button>

const ORDER = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];

// ─── STORAGE ───────────────────────────────────────────────────────────────
function loadData() {
  try {
    const s = localStorage.getItem("rotina_v3");
    return s ? JSON.parse(s) : JSON.parse(JSON.stringify(BASE));
  } catch(e) { return JSON.parse(JSON.stringify(BASE)); }
}
function saveData() {
  localStorage.setItem("rotina_v3", JSON.stringify(DATA));
}
let DATA = loadData();

// ─── UTILS ─────────────────────────────────────────────────────────────────
function toMin(t) { const [h,m] = t.split(":").map(Number); return h*60+m; }
function pad(n) { return String(n).padStart(2,"0"); }
function nowMin() { const n=new Date(); return n.getHours()*60+n.getMinutes(); }
function todayKey() { return ORDER[(new Date().getDay()+6)%7]; }

// ─── CLOCK ─────────────────────────────────────────────────────────────────
function updateClock() {
  const n = new Date();
  document.getElementById("clock").textContent = pad(n.getHours())+":"+pad(n.getMinutes());
}

// ─── BANNER ────────────────────────────────────────────────────────────────
function updateBanner() {
  const key = todayKey();
  const blocks = DATA[key] || [];
  const nm = nowMin();
  let cur = null, nxt = null;
  for (const b of blocks) {
    const s = toMin(b[0]), e = toMin(b[1]);
    if (nm >= s && nm < e && !cur) cur = b;
    else if (nm < s && !nxt) nxt = b;
  }
  document.getElementById("bn-time").textContent = cur ? cur[0]+" – "+cur[1] : "—";
  document.getElementById("bn-task").textContent = cur ? cur[2] : "Fora do horário";
  document.getElementById("bx-time").textContent = nxt ? "às "+nxt[0] : "—";
  document.getElementById("bx-task").textContent = nxt ? nxt[2] : "Fim do dia";
}

// ─── STATE ─────────────────────────────────────────────────────────────────
let current = todayKey();

// ─── RENDER ────────────────────────────────────────────────────────────────
function render() {
  // tabs
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  const today = todayKey();
  ORDER.forEach(d => {
    const b = document.createElement("button");
    b.className = "tab" + (d===today?" today":"") + (d===current?" active":"");
    b.textContent = d;
    b.onclick = () => { current = d; render(); };
    tabs.appendChild(b);
  });

  // list
  const list = document.getElementById("list");
  list.innerHTML = "";
  const nm = nowMin();
  const blocks = DATA[current] || [];
  let foundNext = false;

  blocks.forEach((block, idx) => {
    const [start, end, title, subs] = block;
    const s = toMin(start), e = toMin(end);
    const isNow = current === todayKey() && nm >= s && nm < e;
    const isNext = current === todayKey() && !foundNext && nm < s;
    if (isNext) foundNext = true;

    const div = document.createElement("div");
    div.className = "block" + (isNow?" now":"") + (isNext?" next-block":"");
    if (isNow) div.classList.add("open");

    const header = document.createElement("div");
    header.className = "block-header";
    header.innerHTML = `
      <div class="block-dot ${isNow?"pulse":""}"></div>
      <div class="block-time">${start} – ${end}</div>
      <div class="block-title">${isNow?"▶ ":""}${title}</div>
    `;
    header.onclick = () => div.classList.toggle("open");

    const subWrap = document.createElement("div");
    subWrap.className = "sub-items";

    (subs || []).forEach(s => {
      const item = document.createElement("div");
      item.className = "sub-item";
      const parts = s.match(/^(\S+)\s(.+)$/);
      const icon = parts ? parts[1] : "•";
      const text = parts ? parts[2] : s;
      item.innerHTML = `<span class="sub-icon">${icon}</span><span class="sub-text">${text}</span>`;
      subWrap.appendChild(item);
    });

    // Botão editar
    const editBtn = document.createElement("button");
    editBtn.className = "edit-btn";
    editBtn.innerHTML = "✏️ Editar detalhes";
    editBtn.onclick = (e) => { e.stopPropagation(); openModal(current, idx); };
    subWrap.appendChild(editBtn);

    div.appendChild(header);
    div.appendChild(subWrap);
    list.appendChild(div);

    // Auto-scroll para o atual
    if (isNow) setTimeout(() => div.scrollIntoView({behavior:"smooth", block:"center"}), 100);
  });

  updateBanner();
}

// ─── MODAL EDITOR ──────────────────────────────────────────────────────────
let editingDay = null, editingIdx = null;

function openModal(day, idx) {
  editingDay = day;
  editingIdx = idx;
  const block = DATA[day][idx];
  document.getElementById("modal-title-label").textContent = block[0]+" – "+block[1]+" | "+block[2];
  document.getElementById("modal-textarea").value = (block[3] || []).join("\n");
  document.getElementById("modal").classList.add("open");
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
}

function saveModal() {
  const lines = document.getElementById("modal-textarea").value
    .split("\n").map(l => l.trim()).filter(l => l.length > 0);
  DATA[editingDay][editingIdx][3] = lines;
  saveData();
  closeModal();
  render();
}

document.getElementById("modal").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});

// ─── INIT ──────────────────────────────────────────────────────────────────
updateClock();
render();
setInterval(() => { updateClock(); updateBanner(); render(); }, 60000);
</script>
